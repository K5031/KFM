[project]
name = "kfm"
version = "0.0.0"
description = "Kayden Fleet Manager: teams of Kayden agents that work toward a goal without supervision"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "kayden",
    "mcp>=2.3.0",
    "pydantic>=2",
    "tomli-w>=1.2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
kfm = "kfm.__main__:main"

[project.entry-points."kfm.harnesses"]
kayden = "kfm.harnesses.kayden:factory"

[tool.uv.sources]
kayden = { path = "../Kayden", editable = true }

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kfm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
