[project]
name = "kfm"
version = "0.0.0"
description = "Kaden Fleet Manager: teams of Kaden agents that work toward a goal without supervision"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "kaden",
    "mcp>=2.3.0",
    "pydantic>=2",
    "tomli-w>=1.2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
kfm = "kfm.__main__:main"

[project.gui-scripts]
kfm-desktop = "kfm.desktop:main"

[project.optional-dependencies]
desktop = ["kaden[desktop]"]  # the window is built on Kaden's desktop code


[tool.uv.sources]
kaden = { path = "../Kaden", editable = true }

[dependency-groups]
dev = [
    "kaden[desktop]",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kfm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
