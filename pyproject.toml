[project]
name = "kfm"
version = "0.0.0"
description = "Kadence Fleet Manager: teams of Kadence agents that work toward a goal without supervision"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "kadence",
    "mcp>=2.3.0",
    "pydantic>=2",
    "tomli-w>=1.2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
kfm = "kfm.__main__:main"

[project.gui-scripts]
kfm-desktop = "kfm.desktop:main"

[project.optional-dependencies]
desktop = ["kadence[desktop]"]  # the window is built on Kadence's desktop code

[project.entry-points."kfm.harnesses"]
kadence = "kfm.harnesses.kadence:factory"

[tool.uv.sources]
kadence = { path = "../Kadence", editable = true }

[dependency-groups]
dev = [
    "kadence[desktop]",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kfm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
